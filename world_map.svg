<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" font-family="Georgia, 'Times New Roman', serif">
<defs>
  <radialGradient id="parchment" cx="50%" cy="45%" r="80%">
    <stop offset="0%" stop-color="#f2e3bf"/>
    <stop offset="55%" stop-color="#e8d3a0"/>
    <stop offset="100%" stop-color="#cdae70"/>
  </radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#aecdd9"/>
    <stop offset="100%" stop-color="#8ab0c0"/>
  </linearGradient>
  <radialGradient id="blight" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#8b7a5a"/>
    <stop offset="100%" stop-color="#5c5238"/>
  </radialGradient>
  <radialGradient id="abyss" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#6a2a3a"/>
    <stop offset="100%" stop-color="#2e1420"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1600" height="1400" fill="url(#sea)"/>
<rect x="0" y="0" width="1600" height="1400" fill="none" stroke="#7a5c33" stroke-width="16"/>
<rect x="20" y="20" width="1560" height="1360" fill="none" stroke="#4a2f14" stroke-width="2"/>

<text x="800" y="60" text-anchor="middle" font-size="46" fill="#3a2610" font-weight="bold" letter-spacing="3">THE KNOWN WORLD</text>
<text x="800" y="88" text-anchor="middle" font-size="16" fill="#4a2f14" font-style="italic">first-pass layout, six continents around the Central Sea — not final</text>

<!-- Compass -->
<g transform="translate(1500,120)">
  <circle r="46" fill="#f2e3bf" stroke="#4a2f14" stroke-width="2"/>
  <path d="M0,-40 L8,0 L0,40 L-8,0 Z" fill="#4a2f14"/>
  <path d="M-40,0 L0,8 L40,0 L0,-8 Z" fill="#4a2f14" opacity="0.7"/>
  <text x="0" y="-50" text-anchor="middle" font-size="14" fill="#4a2f14">N</text>
  <text x="0" y="60" text-anchor="middle" font-size="14" fill="#4a2f14">S</text>
  <text x="-58" y="5" text-anchor="middle" font-size="14" fill="#4a2f14">W</text>
  <text x="58" y="5" text-anchor="middle" font-size="14" fill="#4a2f14">E</text>
</g>

<!-- ===================== THE HEARTLANDS (human, NE) ===================== -->
<path d="M 950,180 C 1050,150 1180,170 1240,240 C 1290,300 1280,380 1220,430
         C 1260,470 1250,520 1190,540 C 1120,560 1040,540 990,490
         C 930,510 860,490 830,440 C 790,460 730,440 720,390
         C 700,340 730,270 800,230 C 850,190 900,190 950,180 Z"
      fill="url(#parchment)" stroke="#4a2f14" stroke-width="2.5"/>
<text x="1000" y="260" text-anchor="middle" font-size="24" fill="#4a2f14" font-weight="bold" font-style="italic">THE HEARTLANDS</text>
<text x="1000" y="280" text-anchor="middle" font-size="13" fill="#4a2f14" font-style="italic">(Human continent)</text>

<!-- Aldric's Realm -->
<g transform="translate(870,340)">
  <rect x="-26" y="-8" width="52" height="34" fill="#c9a86a" stroke="#4a2f14" stroke-width="1.4"/>
  <rect x="-33" y="-24" width="12" height="20" fill="#c9a86a" stroke="#4a2f14" stroke-width="1.4"/>
  <rect x="21" y="-24" width="12" height="20" fill="#c9a86a" stroke="#4a2f14" stroke-width="1.4"/>
  <path d="M-33,-24 L-27,-32 L-21,-24 Z" fill="#8b3a3a"/>
  <path d="M21,-24 L27,-32 L33,-24 Z" fill="#8b3a3a"/>
</g>
<text x="870" y="390" text-anchor="middle" font-size="15" fill="#4a2f14" font-weight="bold">Aldric's Realm</text>
<text x="870" y="405" text-anchor="middle" font-size="10" fill="#4a2f14" font-style="italic">(the original map — Royal Heir content)</text>

<!-- The March of Vessair -->
<g transform="translate(1080,420)">
  <rect x="-22" y="-4" width="44" height="26" fill="#a5866a" stroke="#4a2f14" stroke-width="1.3"/>
  <path d="M-22,-4 L0,-20 L22,-4 Z" fill="#a5866a" stroke="#4a2f14" stroke-width="1.3"/>
</g>
<text x="1080" y="458" text-anchor="middle" font-size="14" fill="#4a2f14" font-weight="bold">March of Vessair</text>
<text x="1080" y="472" text-anchor="middle" font-size="10" fill="#4a2f14" font-style="italic">(Merchant-Council)</text>

<!-- ===================== AELENDOR (elf, N) ===================== -->
<path d="M 500,120 C 620,90 740,110 800,170 C 840,210 820,260 760,280
         C 720,320 640,320 580,290 C 500,300 430,270 410,220
         C 400,170 440,140 500,120 Z"
      fill="url(#parchment)" stroke="#3d4f2c" stroke-width="2.5"/>
<text x="600" y="165" text-anchor="middle" font-size="22" fill="#3d4f2c" font-weight="bold" font-style="italic">AELENDOR</text>
<text x="600" y="183" text-anchor="middle" font-size="12" fill="#3d4f2c" font-style="italic">(Elf continent)</text>
<g fill="#5f7a4a" opacity="0.85">
  <circle cx="540" cy="220" r="20"/><circle cx="570" cy="205" r="24"/><circle cx="605" cy="222" r="20"/>
  <circle cx="640" cy="200" r="22"/><circle cx="500" cy="225" r="18"/><circle cx="670" cy="220" r="20"/>
</g>
<text x="590" y="270" text-anchor="middle" font-size="13" fill="#3d4f2c" font-weight="bold">The Unbroken Bough</text>
<text x="590" y="284" text-anchor="middle" font-size="10" fill="#3d4f2c" font-style="italic">(Conclave seat)</text>

<!-- ===================== KHAZGARD (dwarf, SW mountains) ===================== -->
<path d="M 260,700 C 360,660 460,690 500,760 C 530,820 500,880 430,900
         C 400,950 320,960 260,930 C 200,950 140,920 130,860
         C 120,800 170,730 260,700 Z"
      fill="url(#parchment)" stroke="#4a2f14" stroke-width="2.5"/>
<text x="310" y="750" text-anchor="middle" font-size="22" fill="#4a2f14" font-weight="bold" font-style="italic">KHAZGARD</text>
<text x="310" y="768" text-anchor="middle" font-size="12" fill="#4a2f14" font-style="italic">(Dwarf continent — Seven Clanholds)</text>
<g fill="#8a7455" stroke="#4a2f14" stroke-width="1.4">
  <path d="M180,860 L220,800 L255,850 L300,780 L345,860 L390,810 L425,870 Z"/>
</g>
<text x="300" y="900" text-anchor="middle" font-size="12" fill="#4a2f14">The Deep Halls</text>
<text x="300" y="914" text-anchor="middle" font-size="10" fill="#4a2f14" font-style="italic">(High Forge Council)</text>

<!-- ===================== THE ASHREACH (orc, SE) ===================== -->
<path d="M 1080,780 C 1200,750 1310,790 1360,870 C 1400,930 1380,1000 1300,1030
         C 1280,1090 1180,1110 1100,1070 C 1020,1090 940,1050 930,980
         C 900,920 950,840 1080,780 Z"
      fill="url(#parchment)" stroke="#6b3a20" stroke-width="2.5"/>
<text x="1150" y="850" text-anchor="middle" font-size="22" fill="#6b3a20" font-weight="bold" font-style="italic">THE ASHREACH</text>
<text x="1150" y="868" text-anchor="middle" font-size="12" fill="#6b3a20" font-style="italic">(Orc continent — three nations)</text>
<text x="1050" y="950" text-anchor="middle" font-size="12" fill="#6b3a20" font-weight="bold">Ironjaw Coalition</text>
<text x="1200" y="960" text-anchor="middle" font-size="12" fill="#6b3a20" font-weight="bold">Skarr Host</text>
<text x="1120" y="1040" text-anchor="middle" font-size="12" fill="#6b3a20" font-weight="bold">the Ash-Bound</text>
<g transform="translate(1140,1010)" fill="#8a5a3a" opacity="0.8">
  <path d="M-16,10 L-4,-24 L8,-4 L16,10 Z" stroke="#6b3a20" stroke-width="1.3"/>
</g>

<!-- ===================== THE BLIGHTED EXPANSE (Dark Legion, far S) ===================== -->
<path d="M 550,1060 C 680,1030 800,1060 850,1130 C 890,1190 860,1250 780,1270
         C 750,1320 640,1330 560,1300 C 470,1320 400,1280 400,1220
         C 390,1160 450,1090 550,1060 Z"
      fill="url(#blight)" stroke="#2a2418" stroke-width="2.5"/>
<text x="620" y="1130" text-anchor="middle" font-size="22" fill="#f2e3bf" font-weight="bold" font-style="italic">THE BLIGHTED EXPANSE</text>
<text x="620" y="1148" text-anchor="middle" font-size="12" fill="#e8d3a0" font-style="italic">(Dark Legion's continent)</text>
<g stroke="#c9c0a8" stroke-width="1.5" opacity="0.7">
  <path d="M480,1200 L520,1170 M540,1230 L590,1190 M620,1250 L670,1210"/>
</g>

<!-- ===================== THE ABYSSAL RIFT (demon continent, far S, dashed/uncertain) ===================== -->
<path d="M 900,1170 C 1000,1140 1100,1170 1140,1230 C 1170,1280 1140,1330 1070,1340
         C 1040,1370 960,1370 900,1340 C 830,1350 780,1310 790,1260
         C 795,1210 830,1190 900,1170 Z"
      fill="url(#abyss)" stroke="#1a0a10" stroke-width="2" stroke-dasharray="6,5" opacity="0.92"/>
<text x="960" y="1240" text-anchor="middle" font-size="20" fill="#e8b0b8" font-weight="bold" font-style="italic">THE ABYSSAL RIFT</text>
<text x="960" y="1258" text-anchor="middle" font-size="11" fill="#d09aa2" font-style="italic">(Demon continent — only visible once Demon Lord is active)</text>

<!-- ===================== Convocation floating spire, central sea ===================== -->
<g transform="translate(830,650)">
  <line x1="0" y1="0" x2="0" y2="40" stroke="#f2e3bf" stroke-width="2" opacity="0.8"/>
  <path d="M-4,-40 L4,-40 L10,0 L-10,0 Z" fill="#f2e3bf" stroke="#4a2f14" stroke-width="1.3"/>
  <circle cx="0" cy="-46" r="6" fill="#f2e3bf" stroke="#4a2f14" stroke-width="1.3"/>
</g>
<text x="830" y="720" text-anchor="middle" font-size="13" fill="#3a2610" font-weight="bold">The Convocation of Aeth</text>
<text x="830" y="734" text-anchor="middle" font-size="10" fill="#3a2610" font-style="italic">(floating spire, neutral)</text>

<text x="830" y="600" text-anchor="middle" font-size="18" fill="#3a5a66" font-style="italic" opacity="0.85">the Central Sea</text>

<!-- Sea routes (dotted, connecting continents) -->
<g stroke="#4a2f14" stroke-width="2" fill="none" stroke-dasharray="2,10" stroke-linecap="round" opacity="0.55">
  <path d="M870,380 C 750,320 650,260 620,230"/>
  <path d="M850,420 C 700,550 500,650 400,780"/>
  <path d="M1000,450 C 1050,600 1100,700 1130,800"/>
  <path d="M1080,440 C 1150,500 1220,560 1280,650"/>
  <path d="M600,900 C 650,970 700,1030 550,1090"/>
  <path d="M1000,1000 C 950,1080 920,1140 950,1180"/>
</g>

<!-- Legend -->
<g transform="translate(60,1130)">
  <rect x="-10" y="-24" width="480" height="220" fill="#f2e3bf" stroke="#4a2f14" stroke-width="1.5" opacity="0.95"/>
  <text x="0" y="0" font-size="16" fill="#4a2f14" font-weight="bold">LEGEND</text>
  <text x="0" y="26" font-size="12" fill="#4a2f14">Heartlands — Human (Aldric's Realm + March of Vessair)</text>
  <text x="0" y="46" font-size="12" fill="#3d4f2c">Aelendor — Elf (the Unbroken Bough)</text>
  <text x="0" y="66" font-size="12" fill="#4a2f14">Khazgard — Dwarf (Seven Clanholds)</text>
  <text x="0" y="86" font-size="12" fill="#6b3a20">The Ashreach — Orc (Ironjaw / Skarr / Ash-Bound)</text>
  <text x="0" y="106" font-size="12" fill="#5c5238">The Blighted Expanse — Dark Legion continent</text>
  <text x="0" y="126" font-size="12" fill="#6a2a3a">The Abyssal Rift — Demon continent (endgame-only)</text>
  <text x="0" y="150" font-size="12" fill="#3a2610">Spire icon — the Convocation of Aeth (neutral mages)</text>
  <text x="0" y="170" font-size="12" fill="#3a2610">Dotted lines — known sea routes (approximate)</text>
  <text x="0" y="194" font-size="11" fill="#6b4a22" font-style="italic">First-pass world layout — move anything, this is a starting point.</text>
</g>

</svg>